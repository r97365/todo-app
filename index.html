<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="待辦" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
  <title>待辦事項</title>
  <style>
    :root{
      --bg:#0f1012; --panel:#17181b; --panel2:#1e2024; --text:#f5f7fa;
      --muted:#9ca3af; --line:#2a2d33; --accent:#ffffff; --danger:#ff5d5d;
      --shadow:0 12px 30px rgba(0,0,0,.24);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f4f5f7; --panel:#ffffff; --panel2:#f2f3f5; --text:#16181c;
        --muted:#6b7280; --line:#e4e7eb; --accent:#111827; --danger:#d9363e;
        --shadow:0 10px 28px rgba(0,0,0,.08);
      }
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif}
    body{min-height:100vh}
    button,input,select{font:inherit}
    .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 118px)}
    .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
    h1{font-size:34px;letter-spacing:-.8px;margin:0;font-weight:800}
    .sub{font-size:13px;color:var(--muted);margin-top:4px}
    .iconBtn{width:42px;height:42px;border:none;border-radius:14px;background:var(--panel);color:var(--text);font-size:24px;box-shadow:var(--shadow)}
    .composer{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-bottom:22px}
    .row{display:flex;gap:9px}
    #taskInput{flex:1;min-width:0;border:none;outline:none;background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:14px}
    #categorySelect{border:none;outline:none;background:var(--panel2);color:var(--text);padding:0 10px;border-radius:14px;max-width:128px}
    #addBtn{width:46px;border:none;border-radius:14px;background:var(--accent);color:var(--bg);font-size:24px;font-weight:700}
    .hint{font-size:12px;color:var(--muted);margin:9px 2px 1px}
    .section{margin:24px 0}
    .section.dragging{
      position:fixed!important;
      z-index:1000;
      margin:0!important;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--panel);
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      transform:scale(1.025);
      opacity:.98;
      pointer-events:none;
      transition:transform .16s ease,box-shadow .16s ease;
    }
    .section.dragging .tasks{display:none!important}
    .section.dragging .sectionHead{margin:0}
    .sectionPlaceholder{
      margin:24px 0;
      border-radius:18px;
      border:1px dashed color-mix(in srgb,var(--accent) 30%,var(--line));
      background:color-mix(in srgb,var(--panel2) 80%,transparent);
      opacity:.55;
      transition:height .16s ease,transform .16s ease;
    }
    .sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:6px 2px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .sectionHead *{user-select:none!important;-webkit-user-select:none!important;-webkit-touch-callout:none!important}
    .sectionTitle{font-size:19px;font-weight:800}
    .sectionMeta{display:flex;align-items:center;gap:8px}
    .count{font-size:12px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:99px}
    .chevron{width:24px;height:24px;display:grid;place-items:center;color:var(--muted);font-size:18px;transition:transform .18s ease}
    .section.collapsed .chevron{transform:rotate(-90deg)}
    .section.collapsed .sectionHead{margin-bottom:0}
    .section.collapsed .tasks{display:none}
    .tasks{display:flex;flex-direction:column;gap:8px}
    .taskSwipe{position:relative;overflow:hidden;border-radius:16px;touch-action:pan-y}
    .swipeAction{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;font-size:14px;font-weight:800;letter-spacing:.2px;pointer-events:none}
    .swipeDone{left:0;justify-content:flex-start;padding-left:18px;background:#2e9d61;color:#fff}
    .swipeRestore{left:0;justify-content:flex-start;padding-left:18px;background:#3f7edb;color:#fff}
    .swipeDelete{right:0;justify-content:flex-end;padding-right:18px;background:#d94a4a;color:#fff}
    .task{position:relative;z-index:2;display:flex;align-items:center;gap:11px;background:color-mix(in srgb,var(--task-color,#7d8795) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--task-color,#7d8795) 35%,var(--line));border-left:4px solid var(--task-color,#7d8795);border-radius:16px;padding:12px 12px;transition:transform .18s ease,opacity .18s ease}
    .task.swiping{transition:none}
    .check{width:26px;height:26px;border:2px solid color-mix(in srgb,var(--task-color,#7d8795) 75%,var(--muted));border-radius:50%;flex:0 0 auto;background:transparent;display:grid;place-items:center;color:var(--bg);font-weight:900}
    .task.done .check{background:var(--accent);border-color:var(--accent)}
    .task.done .check::after{content:"✓";font-size:16px}
    .taskText{flex:1;font-size:17px;line-height:1.35;word-break:break-word}
    .task.done .taskText{text-decoration:line-through;color:var(--muted)}
    .more{border:none;background:transparent;color:var(--muted);font-size:21px;padding:5px 6px}
    .empty{color:var(--muted);font-size:14px;padding:6px 3px}
    .bottomBar{
      position:fixed;
      left:0;
      right:0;
      bottom:calc(env(safe-area-inset-bottom) + 12px);
      z-index:900;
      display:flex;
      justify-content:center;
      padding:0 18px;
      pointer-events:none;
    }
    .pill{display:flex;background:rgba(28,30,34,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow);pointer-events:auto}
    @media (prefers-color-scheme: light){.pill{background:rgba(255,255,255,.92)}}
    .pill button{border:none;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px}
    .pill button.active{background:var(--panel2);color:var(--text);font-weight:700}
    dialog{border:none;border-radius:22px;background:var(--panel);color:var(--text);width:min(92vw,420px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
    .dialogBody{padding:18px}
    .dialogTitle{font-size:20px;font-weight:800;margin-bottom:14px}
    .dialogBody input,.dialogBody select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px;border-radius:13px;margin-bottom:10px;outline:none}
    .dialogActions{display:flex;gap:8px;margin-top:8px}
    .dialogActions button{flex:1;border:none;padding:12px;border-radius:13px;background:var(--panel2);color:var(--text)}
    .dialogActions .primary{background:var(--accent);color:var(--bg);font-weight:700}
    .danger{color:var(--danger)!important}
    .colorLabel{font-size:13px;color:var(--muted);margin:4px 0 9px}
    .colorPalette{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}
    .colorDot{width:31px;height:31px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);padding:0}
    .colorDot.selected{border-color:var(--text);transform:scale(1.06)}
    .categoryManageList{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
    .categoryManageRow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .categoryManageName{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .categoryRenameBtn,.categoryRenameSave,.categoryRenameCancel{border:none;background:var(--panel);color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .categoryRenameBtn{width:38px;height:38px;padding:0;display:grid;place-items:center}
    .categoryRenameBtn svg{width:18px;height:18px;display:block}
    .categoryRenameInput{flex:1!important;min-width:0;margin:0!important;padding:9px 10px!important}
    .categorySectionLabel{font-size:13px;color:var(--muted);margin:2px 0 8px}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>待辦事項</h1>
        <div class="sub" id="dateText"></div>
      </div>
      <button class="iconBtn" id="settingsBtn" aria-label="設定">⋯</button>
    </div>
    <section class="composer">
      <div class="row">
        <input id="taskInput" placeholder="新增一件事…" autocomplete="off" />
        <select id="categorySelect"></select>
        <button id="addBtn" aria-label="新增">＋</button>
      </div>
      <div class="hint">不用排時間。想到就記，做完就勾。</div>
    </section>
    <div id="sections"></div>
    <div class="bottomBar">
      <div class="pill">
        <button data-filter="open" class="active">待辦</button>
        <button data-filter="all">全部</button>
        <button data-filter="done">已完成</button>
      </div>
    </div>
  </main>
  <dialog id="editDialog">
    <div class="dialogBody">
      <div class="dialogTitle">編輯待辦</div>
      <input id="editText" />
      <select id="editCategory"></select>
      <div class="colorLabel">顏色</div>
      <div class="colorPalette" id="editColorPalette"></div>
      <div class="dialogActions">
        <button class="danger" id="deleteBtn">刪除</button>
        <button id="cancelBtn">取消</button>
        <button class="primary" id="saveBtn">儲存</button>
      </div>
    </div>
  </dialog>
  <dialog id="settingsDialog">
    <div class="dialogBody">
      <div class="dialogTitle">分類管理</div>
      <div class="categoryManageList" id="categoryManageList"></div>
      <div class="categorySectionLabel">新增分類</div>
      <input id="newCategory" placeholder="例如：工作" />
      <div class="dialogActions">
        <button id="closeSettings">關閉</button>
        <button class="primary" id="addCategoryBtn">新增分類</button>
      </div>
    </div>
  </dialog>
<script>
const DEFAULT_CATEGORIES = ["回台南","高雄","研究","有空做","購物清單"];
const DEFAULT_TASKS = [];
const TASK_COLORS = ["#7d8795","#4f8cff","#35b86b","#e5b93f","#ee8a3b","#e45b5b","#9b6bea","#d864a3"];
let categories = JSON.parse(localStorage.getItem("todo_categories") || "null") || DEFAULT_CATEGORIES.slice();
let tasks = JSON.parse(localStorage.getItem("todo_tasks") || "null") || DEFAULT_TASKS.slice();
let filter = "open";
let editingId = null;
let editingColor = TASK_COLORS[0];
let selectedCategory = localStorage.getItem("todo_selected_category") || categories[0] || "";
let collapsedCategories = new Set(JSON.parse(localStorage.getItem("todo_collapsed_categories") || "[]"));
const $ = s => document.querySelector(s);
const sections = $("#sections");
const taskInput = $("#taskInput");
const categorySelect = $("#categorySelect");
const editDialog = $("#editDialog");
const settingsDialog = $("#settingsDialog");
function save(){
  localStorage.setItem("todo_categories", JSON.stringify(categories));
  localStorage.setItem("todo_tasks", JSON.stringify(tasks));
  localStorage.setItem("todo_selected_category", selectedCategory);
  localStorage.setItem("todo_collapsed_categories", JSON.stringify([...collapsedCategories]));
}
function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function fillCategories(){
  const opts = categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  categorySelect.innerHTML = opts;
  $("#editCategory").innerHTML = opts;

  if(!categories.includes(selectedCategory)){
    selectedCategory = categories[0] || "";
  }
  categorySelect.value = selectedCategory;
}
function visible(t){
  if(filter==="open") return !t.done;
  if(filter==="done") return t.done;
  return true;
}
function taskColor(t){
  return TASK_COLORS.includes(t.color) ? t.color : TASK_COLORS[0];
}
function renderColorPalette(){
  const palette = $("#editColorPalette");
  palette.innerHTML = "";
  TASK_COLORS.forEach(color => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "colorDot" + (editingColor === color ? " selected" : "");
    b.style.background = color;
    b.setAttribute("aria-label", "選擇顏色");
    b.onclick = () => {
      editingColor = color;
      renderColorPalette();
    };
    palette.appendChild(b);
  });
}
function renameCategory(oldName, newName){
  newName = newName.trim();
  if(!newName || newName === oldName) return false;
  if(categories.includes(newName)){
    alert("這個分類名稱已經存在。");
    return false;
  }

  const index = categories.indexOf(oldName);
  if(index === -1) return false;
  categories[index] = newName;

  tasks.forEach(t => {
    if(t.category === oldName) t.category = newName;
  });

  if(selectedCategory === oldName) selectedCategory = newName;
  if(collapsedCategories.has(oldName)){
    collapsedCategories.delete(oldName);
    collapsedCategories.add(newName);
  }

  save();
  render();
  return true;
}

function renderCategoryManager(){
  const list = $("#categoryManageList");
  list.innerHTML = "";

  categories.forEach(category => {
    const row = document.createElement("div");
    row.className = "categoryManageRow";
    row.innerHTML = `
      <div class="categoryManageName">${esc(category)}</div>
      <button class="categoryRenameBtn" type="button" aria-label="重新命名" title="重新命名">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20h4.25L19.4 8.85a2.1 2.1 0 0 0 0-2.97l-1.28-1.28a2.1 2.1 0 0 0-2.97 0L4 15.75V20Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m13.8 5.95 4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>`;

    row.querySelector(".categoryRenameBtn").onclick = () => {
      row.innerHTML = `
        <input class="categoryRenameInput" value="${esc(category)}" maxlength="40" />
        <button class="categoryRenameCancel" type="button">取消</button>
        <button class="categoryRenameSave" type="button">儲存</button>`;

      const input = row.querySelector(".categoryRenameInput");
      input.focus();
      input.select();

      const cancel = () => renderCategoryManager();
      const commit = () => {
        const changed = renameCategory(category, input.value);
        if(changed) renderCategoryManager();
      };

      row.querySelector(".categoryRenameCancel").onclick = cancel;
      row.querySelector(".categoryRenameSave").onclick = commit;
      input.addEventListener("keydown", e => {
        if(e.key === "Enter") commit();
        if(e.key === "Escape") cancel();
      });
    };

    list.appendChild(row);
  });
}

function setupSwipe(wrapper, taskEl, t){
  let startX = 0, startY = 0, dx = 0, horizontal = false, moved = false;
  const threshold = 76;
  wrapper.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dx = 0; horizontal = false; moved = false;
    taskEl.classList.add("swiping");
  }, {passive:true});
  wrapper.addEventListener("touchmove", e => {
    if(e.touches.length !== 1) return;
    const x = e.touches[0].clientX - startX;
    const y = e.touches[0].clientY - startY;
    if(!horizontal && Math.abs(x) > 8 && Math.abs(x) > Math.abs(y) * 1.15) horizontal = true;
    if(!horizontal) return;
    e.preventDefault();
    dx = Math.max(-125, Math.min(125, x));
    moved = moved || Math.abs(dx) > 12;
    taskEl.style.transform = `translateX(${dx}px)`;
  }, {passive:false});
  wrapper.addEventListener("touchend", () => {
    taskEl.classList.remove("swiping");
    taskEl.style.transform = "";
    if(moved) wrapper.dataset.justSwiped = "1";
    setTimeout(() => delete wrapper.dataset.justSwiped, 250);

    if(dx >= threshold){
      t.done = !t.done;
      save();
      render();
    } else if(dx <= -threshold){
      tasks = tasks.filter(x => x.id !== t.id);
      save();
      render();
    }
    dx = 0;
  });
}
function render(){
  fillCategories();
  sections.innerHTML = "";
  for(const category of categories){
    const list = tasks.filter(t=>t.category===category && visible(t)).sort((a,b)=>a.created-b.created);
    if(list.length===0 && filter!=="all") continue;
    const section = document.createElement("section");
    const isCollapsed = collapsedCategories.has(category);
    section.className = "section" + (isCollapsed ? " collapsed" : "");
    section.dataset.category = category;
    section.innerHTML = `
      <div class="sectionHead" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
        <div class="sectionTitle">${esc(category)}</div>
        <div class="sectionMeta">
          <div class="count">${list.length}</div>
          <div class="chevron" aria-hidden="true">⌄</div>
        </div>
      </div>
      <div class="tasks"></div>`;
    const head = section.querySelector(".sectionHead");
    head.onselectstart = () => false;
    head.oncontextmenu = e => e.preventDefault();
    head.ondragstart = e => e.preventDefault();
    const toggleSection = () => {
      if(collapsedCategories.has(category)) collapsedCategories.delete(category);
      else collapsedCategories.add(category);
      save();
      render();
    };
    let longPressTimer = null;
    let longPressed = false;
    let dragActive = false;
    let startTouchX = 0;
    let startTouchY = 0;
    let dragOffsetY = 0;
    let placeholder = null;

    const beginCategoryDrag = () => {
      longPressed = true;
      dragActive = true;

      const rect = section.getBoundingClientRect();
      const fullHeight = section.offsetHeight;

      placeholder = document.createElement("div");
      placeholder.className = "sectionPlaceholder";
      placeholder.style.height = fullHeight + "px";
      section.before(placeholder);

      section.classList.add("dragging");
      section.style.left = rect.left + "px";
      section.style.top = rect.top + "px";
      section.style.width = rect.width + "px";
      dragOffsetY = startTouchY - rect.top;

      if(navigator.vibrate) navigator.vibrate(18);
    };

    const placePlaceholderAt = y => {
      const candidates = [...sections.querySelectorAll(".section:not(.dragging)")];
      let placed = false;

      for(const target of candidates){
        const rect = target.getBoundingClientRect();
        if(y < rect.top + rect.height / 2){
          target.before(placeholder);
          placed = true;
          break;
        }
      }
      if(!placed) sections.appendChild(placeholder);
    };

    const finishCategoryDrag = () => {
      clearTimeout(longPressTimer);
      if(!dragActive) return;

      dragActive = false;

      let next = placeholder?.nextElementSibling;
      while(next && (!next.classList?.contains("section") || next === section)) next = next.nextElementSibling;

      let prev = placeholder?.previousElementSibling;
      while(prev && (!prev.classList?.contains("section") || prev === section)) prev = prev.previousElementSibling;

      const nextCategory = next?.dataset?.category || null;
      const prevCategory = prev?.dataset?.category || null;

      categories = categories.filter(c => c !== category);
      if(nextCategory && categories.includes(nextCategory)){
        categories.splice(categories.indexOf(nextCategory), 0, category);
      } else if(prevCategory && categories.includes(prevCategory)){
        categories.splice(categories.indexOf(prevCategory) + 1, 0, category);
      } else {
        categories.push(category);
      }

      placeholder?.remove();
      section.classList.remove("dragging");
      section.removeAttribute("style");
      save();
      render();
    };

    head.addEventListener("touchstart", e => {
      if(e.touches.length !== 1) return;
      longPressed = false;
      dragActive = false;
      startTouchX = e.touches[0].clientX;
      startTouchY = e.touches[0].clientY;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(beginCategoryDrag, 450);
    }, {passive:true});

    head.addEventListener("touchmove", e => {
      if(e.touches.length !== 1) return;
      const touch = e.touches[0];

      if(!dragActive){
        if(Math.abs(touch.clientX - startTouchX) > 10 || Math.abs(touch.clientY - startTouchY) > 10){
          clearTimeout(longPressTimer);
        }
        return;
      }

      e.preventDefault();
      section.style.top = (touch.clientY - dragOffsetY) + "px";
      placePlaceholderAt(touch.clientY);

      if(touch.clientY < 85) window.scrollBy(0, -12);
      else if(touch.clientY > window.innerHeight - 95) window.scrollBy(0, 12);
    }, {passive:false});

    head.addEventListener("touchend", finishCategoryDrag);
    head.addEventListener("touchcancel", finishCategoryDrag);

    head.onclick = () => {
      if(longPressed){
        longPressed = false;
        return;
      }
      toggleSection();
    };
    head.onkeydown = e => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        toggleSection();
      }
    };
    const holder = section.querySelector(".tasks");
    if(list.length===0){
      holder.innerHTML = `<div class="empty">目前沒有項目</div>`;
    } else {
      for(const t of list){
        const wrapper = document.createElement("div");
        wrapper.className = "taskSwipe";
        const rightSwipeClass = t.done ? "swipeRestore" : "swipeDone";
        const rightSwipeText = t.done ? "↩ 復原" : "✓ 完成";
        wrapper.innerHTML = `
          <div class="swipeAction ${rightSwipeClass}">${rightSwipeText}</div>
          <div class="swipeAction swipeDelete">刪除</div>
          <div class="task${t.done ? " done" : ""}" style="--task-color:${taskColor(t)}">
            <button class="check" aria-label="完成"></button>
            <div class="taskText">${esc(t.text)}</div>
            <button class="more" aria-label="編輯">•••</button>
          </div>`;
        const el = wrapper.querySelector(".task");
        el.querySelector(".check").onclick = e => { e.stopPropagation(); t.done = !t.done; save(); render(); };
        el.querySelector(".taskText").onclick = () => {
          if(wrapper.dataset.justSwiped) return;
          openEdit(t.id);
        };
        el.querySelector(".more").onclick = e => {
          e.stopPropagation();
          if(wrapper.dataset.justSwiped) return;
          openEdit(t.id);
        };
        setupSwipe(wrapper, el, t);
        holder.appendChild(wrapper);
      }
    }
    sections.appendChild(section);
  }
  if(sections.children.length===0){
    sections.innerHTML = `<div class="empty" style="padding:24px 4px">這裡目前是空的。</div>`;
  }
}
function addTask(){
  const text = taskInput.value.trim();
  if(!text) return;
  const category = categorySelect.value || selectedCategory || categories[0];
  selectedCategory = category;
  tasks.push({id: crypto.randomUUID(), text, category, color:TASK_COLORS[0], done:false, created:Date.now()});
  taskInput.value = "";
  save(); render(); taskInput.focus();
}
function openEdit(id){
  editingId = id;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  $("#editText").value = t.text;
  $("#editCategory").value = t.category;
  editingColor = taskColor(t);
  renderColorPalette();
  editDialog.showModal();
}
$("#addBtn").onclick = addTask;
categorySelect.addEventListener("change", () => {
  selectedCategory = categorySelect.value;
  save();
});
taskInput.addEventListener("keydown", e => { if(e.key==="Enter") addTask(); });
document.querySelectorAll("[data-filter]").forEach(b=>{
  b.onclick = ()=>{
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active", x===b));
    render();
  }
});
$("#cancelBtn").onclick = ()=>editDialog.close();
$("#saveBtn").onclick = ()=>{
  const t = tasks.find(x=>x.id===editingId);
  if(!t) return editDialog.close();
  const txt = $("#editText").value.trim();
  if(txt) t.text = txt;
  t.category = $("#editCategory").value;
  t.color = editingColor;
  save(); render(); editDialog.close();
};
$("#deleteBtn").onclick = ()=>{
  tasks = tasks.filter(x=>x.id!==editingId);
  save(); render(); editDialog.close();
};
$("#settingsBtn").onclick = ()=>{
  renderCategoryManager();
  settingsDialog.showModal();
};
$("#closeSettings").onclick = ()=>settingsDialog.close();
$("#addCategoryBtn").onclick = ()=>{
  const name = $("#newCategory").value.trim();
  if(name && !categories.includes(name)){
    categories.push(name);
    $("#newCategory").value="";
    save();
    render();
    settingsDialog.close();
  } else if(name && categories.includes(name)){
    alert("這個分類名稱已經存在。");
  }
};
$("#dateText").textContent = new Intl.DateTimeFormat("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
